# api-gateway configuration. No credentials or secrets live here (see user-service/application.yaml).

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      timeout: 500ms
  cloud:
    gateway:
      server:
        webflux:
          x-forwarded:
            enabled: true
          # X-Forwarded-* are only honoured/emitted for these peers: the in-VPC load balancer
          # (RFC 1918 ranges) and loopback. Override GATEWAY_TRUSTED_PROXIES per environment.
          trusted-proxies: ${GATEWAY_TRUSTED_PROXIES:(10\.\d{1,3}\.\d{1,3}\.\d{1,3})|(172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})|(192\.168\.\d{1,3}\.\d{1,3})|(127\.\d{1,3}\.\d{1,3}\.\d{1,3})|(0:0:0:0:0:0:0:1)}
          httpclient:
            connect-timeout: 2000
            response-timeout: 10s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  max-http-request-header-size: 16KB

foodflow:
  gateway:
    routes:
      user-service: ${USER_SERVICE_URL}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
    # Largest accepted request body (413 above); protects services from oversized JSON payloads
    max-request-size: ${GATEWAY_MAX_REQUEST_SIZE:256KB}
    client-ip:
      # Proxies in front of the gateway that append X-Forwarded-For (ALB = 1; CloudFront + ALB = 2)
      trusted-hops: ${GATEWAY_TRUSTED_HOPS:1}
    rate-limit:
      enabled: true
      auth:
        replenish-rate: ${RATE_LIMIT_AUTH_PER_SECOND:1}
        burst-capacity: ${RATE_LIMIT_AUTH_BURST:10}
      session:
        replenish-rate: ${RATE_LIMIT_SESSION_PER_SECOND:10}
        burst-capacity: ${RATE_LIMIT_SESSION_BURST:30}
      api:
        replenish-rate: ${RATE_LIMIT_API_PER_SECOND:20}
        burst-capacity: ${RATE_LIMIT_API_BURST:40}
  security:
    jwt:
      issuer: ${JWT_ISSUER}
      audience: ${JWT_AUDIENCE:foodflow-api}
      jwk-set-uri: ${JWT_JWK_SET_URI:${USER_SERVICE_URL}/.well-known/jwks.json}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    export:
      enabled: ${TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        enabled: ${OTLP_METRICS_ENABLED:false}
        url: ${OTLP_METRICS_URL:http://localhost:4318/v1/metrics}

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
