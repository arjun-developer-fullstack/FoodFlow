# Local development profile (SPRING_PROFILES_ACTIVE=local) against infra/docker and a locally
# running user-service on :8081. No secrets are needed locally (Redis runs without auth in compose).

# Local values for the variables referenced by application.yaml.
#
# They are defined as variables (not by overriding foodflow.gateway.routes.user-service etc.)
# because the configuration guard checks every property source, including application.yaml
# itself: each ${VARIABLE} there must resolve. Real environment variables still take precedence.
# JWT_JWK_SET_URI is derived from USER_SERVICE_URL by application.yaml.
USER_SERVICE_URL: http://localhost:8081
CORS_ALLOWED_ORIGINS: http://localhost:5173
# Must match the issuer configured in the user-service local profile
JWT_ISSUER: http://localhost:8080
REDIS_HOST: localhost

server:
  # Reachable from this machine only, never from the network (the compose ports are bound the same way).
  # IPv4 loopback: JVM clients resolve "localhost" to 127.0.0.1 first; Node falls back to it automatically.
  address: 127.0.0.1

management:
  tracing:
    sampling:
      probability: 1.0
    export:
      enabled: true
  otlp:
    metrics:
      export:
        enabled: true
