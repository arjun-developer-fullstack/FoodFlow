# Reusable pipeline for every FoodFlow Java microservice.
# Each service has a thin caller workflow (e.g. user-service.yml) triggered only by changes
# under its own path, so services are built, tested and shipped independently.
name: reusable-java-service

on:
  workflow_call:
    inputs:
      service:
        description: Maven module directory under backend/ (e.g. user-service)
        required: true
        type: string
      java-version:
        required: false
        type: string
        default: "21"

permissions:
  contents: read

jobs:
  build-test:
    name: build & test (${{ inputs.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: ${{ inputs.java-version }}
          cache: maven

      # Unit tests (surefire) + integration tests with Testcontainers (failsafe) + JaCoCo report.
      # GitHub-hosted Ubuntu runners provide Docker, so *IT tests run for real here.
      - name: Verify
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp -pl ${{ inputs.service }} -am verify

      # Integration tests skip themselves without Docker (for developer laptops). In CI a skipped IT
      # means the environment is broken, so it must fail the build rather than pass silently.
      - name: Fail if integration tests were skipped
        env:
          SERVICE: ${{ inputs.service }}
        run: |
          shopt -s nullglob
          reports=("$SERVICE"/target/failsafe-reports/TEST-*.xml)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "::error::No integration test reports found for $SERVICE"; exit 1
          fi
          if grep -l 'skipped="[1-9]' "${reports[@]}"; then
            echo "::error::Integration tests were skipped (is Docker available on the runner?)"; exit 1
          fi

      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.service }}-reports
          path: |
            backend/${{ inputs.service }}/target/surefire-reports/
            backend/${{ inputs.service }}/target/failsafe-reports/
            backend/${{ inputs.service }}/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14

  # Publishing to GHCR is DISABLED by default. It runs only on pushes to main AND when the repository
  # variable PUBLISH_IMAGES is set to 'true' (Settings > Secrets and variables > Actions > Variables).
  image:
    name: container image (${{ inputs.service }})
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUBLISH_IMAGES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: ${{ inputs.java-version }}
          cache: maven

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Cloud Native Buildpacks (no Dockerfile): non-root, layered, reproducible JRE 21 image.
      - name: Build & push image
        env:
          SERVICE: ${{ inputs.service }}
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          chmod +x mvnw
          IMAGE="ghcr.io/${OWNER,,}/foodflow-${SERVICE}"
          ./mvnw -B -ntp -pl "$SERVICE" -am install -DskipTests
          ./mvnw -B -ntp -pl "$SERVICE" spring-boot:build-image-no-fork \
            -Dspring-boot.build-image.imageName="${IMAGE}:${SHA::12}" \
            -Dspring-boot.build-image.tags="${IMAGE}:main"
          docker push "${IMAGE}:${SHA::12}"
          docker push "${IMAGE}:main"
