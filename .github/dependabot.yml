version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    groups:
      spring:
        patterns: ["org.springframework*"]
    open-pull-requests-limit: 10

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
    ignore:
      # typescript-eslint (8.73.0, latest as of 2026-11) supports only typescript <6.1.0 and fails
      # hard on TS 7.0. Stay on TS 6.x (patch updates still allowed) until a typescript-eslint
      # release widens its typescript peer range; then remove this rule and upgrade both together.
      # Tracking: https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /infra/docker
    schedule:
      interval: monthly
    ignore:
      # A PostgreSQL major upgrade (17 -> 18) cannot be a tag bump: the on-disk format changes
      # (needs pg_upgrade or dump/restore), the 18+ images move PGDATA to /var/lib/postgresql/18/docker
      # (our volume mounts /var/lib/postgresql/data), and the PostGIS extension version must not go
      # backwards. Do it as a planned migration; PostGIS/patch updates within PostgreSQL 17 still arrive.
      - dependency-name: "postgis/postgis"
        update-types: ["version-update:semver-major"]
